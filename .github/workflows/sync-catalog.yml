name: Auto-Sync Manga Catalog & Chapters
on:
  schedule:
    # Runs twice daily right after global peak release windows (03:00 & 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  sync-catalog:
    name: Sync Chapter Counts & Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Chapter Count & Catalog Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/sync_manga_chapter_counts.ts
