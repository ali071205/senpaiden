name: System Health Check
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: github-action/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: github-action

      - name: Ping Supabase (prevents free-tier auto-pause)
        working-directory: github-action
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lsdnqbfiytyonvmzurxj.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZG5xYmZpeXR5b252bXp1cnhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjUzMDUsImV4cCI6MjEwMDQ0MTMwNX0.-Hxi0RLRwVDQVeRV8EGgVkDwTKZRr_QhIsaQhfSGaQc' }}
        run: |
          node -e "
            try {
              const url = (process.env.SUPABASE_URL || 'https://lsdnqbfiytyonvmzurxj.supabase.co').trim();
              const key = (process.env.SUPABASE_SERVICE_KEY || '').trim();
              if (!url || !key) {
                console.warn('⚠️ No Supabase credentials available — skipping ping.');
                process.exit(0);
              }
              const { createClient } = require('@supabase/supabase-js');
              const sb = createClient(url, key);
              sb.from('manga').select('id', { count: 'exact', head: true })
                .then(({ count, error }) => {
                  if (error) {
                    console.warn('Supabase ping notice:', error.message);
                  } else {
                    console.log('Supabase OK — ' + count + ' manga records active.');
                  }
                  process.exit(0);
                })
                .catch((err) => {
                  console.warn('Supabase ping error:', err.message);
                  process.exit(0);
                });
            } catch (err) {
              console.warn('Supabase ping exception caught:', err.message);
              process.exit(0);
            }
          "

      - name: Check HF Worker health endpoint
        continue-on-error: true
        env:
          HF_WORKER_URL: ${{ secrets.HF_WORKER_URL }}
        run: |
          if [ -z "$HF_WORKER_URL" ]; then
            echo "HF_WORKER_URL not configured — skipping."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$HF_WORKER_URL")
          if [ "$STATUS" -eq 200 ]; then
            echo "HF Worker OK (HTTP $STATUS)"
          else
            echo "HF Worker UNHEALTHY (HTTP $STATUS)"
          fi

      - name: Log health check result to Supabase
        working-directory: github-action
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lsdnqbfiytyonvmzurxj.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: |
          node -e "
            try {
              const url = (process.env.SUPABASE_URL || '').trim();
              const key = (process.env.SUPABASE_SERVICE_KEY || '').trim();
              if (!url || !key) {
                console.log('Note: SUPABASE_SERVICE_KEY not set for writing error_log, skipping DB logging.');
                process.exit(0);
              }
              const { createClient } = require('@supabase/supabase-js');
              const sb = createClient(url, key);
              sb.from('error_log').insert({
                provider: 'health_check',
                error_type: 'HEALTH_PING',
                error_detail: 'Automated health check completed at ' + new Date().toISOString()
              }).then(({ error }) => {
                if (error) console.warn('Failed to log health check:', error.message);
                else console.log('Health check logged successfully.');
                process.exit(0);
              }).catch((err) => {
                console.warn('Failed to log health check:', err.message);
                process.exit(0);
              });
            } catch (err) {
              console.warn('Log health check exception caught:', err.message);
              process.exit(0);
            }
          "
